name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      GOFLAGS: -mod=readonly
      GOTOOLCHAIN: local

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Download modules
        run: make deps

      - name: Check repository data boundary
        run: make data-boundary

      - name: Verify modules
        run: make mod-verify

      - name: Check formatting
        run: make fmt-check

      - name: Check scripts
        run: make scripts-check

      - name: Vet
        run: make vet

      - name: Test with race detector
        run: make test-race

      - name: Build CLI
        run: make build BINARY="${RUNNER_TEMP}/gozillo"

  platform:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest

    env:
      GOFLAGS: -mod=readonly
      GOTOOLCHAIN: local

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Test
        run: go test -count=1 ./...

      - name: Build CLI
        run: go build -trimpath ./cmd/gozillo
